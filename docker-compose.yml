services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/fidelity.sqlite
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3001"
    volumes:
      - fidelity_data:/app/data
      # Optional: uncomment after creating ./certs and configuring wallet paths.
      # An empty/missing configuration leaves wallet issuance disabled.
      # - ./certs:/app/certs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  fidelity_data:
